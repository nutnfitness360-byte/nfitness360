<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="%REACT_APP_THEME_COLOR%" />
    <meta name="description" content="%REACT_APP_SITE_DESC%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%REACT_APP_APP_NAME%" />
    <title>%REACT_APP_PAGE_TITLE%</title>
    <!-- Identidad de la app (ícono, nombre, tema, manifest) + vista previa al compartir
         (Open Graph / Twitter). TODO se resuelve POR INSTANCIA al compilar: cada proyecto
         de Vercel define sus REACT_APP_* ; si no hay nada definido (Natalia) se usan los
         valores por defecto de .env.production (Nfitness). Esto hace que iOS/Android lean
         el ícono y el nombre correctos de la pantalla de inicio desde el HTML estático. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%REACT_APP_SITE_TITLE%" />
    <meta property="og:title" content="%REACT_APP_SITE_TITLE%" />
    <meta property="og:description" content="%REACT_APP_SITE_DESC%" />
    <meta property="og:image" content="%REACT_APP_OG_IMAGE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%REACT_APP_SITE_TITLE%" />
    <meta name="twitter:description" content="%REACT_APP_SITE_DESC%" />
    <meta name="twitter:image" content="%REACT_APP_OG_IMAGE%" />
    <link rel="icon" href="%REACT_APP_FAVICON_ICO%" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%REACT_APP_FAVICON_32%" />
    <link rel="apple-touch-icon" href="%REACT_APP_APPLE_ICON%" />
    <link rel="manifest" href="%REACT_APP_MANIFEST%" />
    <script>
      /* Refuerzo SOLO para los dominios REALES de Aretia / demo: ajusta en caliente el
         título/tema/ícono por si el build no trae definidas las variables de Aretia.
         Cualquier subdominio nuevo bajo aretia.mx (nutrialego., majoluna., etc.) NO es
         Aretia: su identidad la definen las variables de entorno de su propio proyecto. */
      (function () {
        try {
          var h = location.hostname;
          var esAretiaReal = (h === 'aretia.mx' || h === 'www.aretia.mx' || h === 'app.aretia.mx');
          if (h.indexOf('sistemanutricio') === -1 && !esAretiaReal) return;
          function setLink(rel, href, type, sizes) {
            var sel = 'link[rel="' + rel + '"]' + (sizes ? '[sizes="' + sizes + '"]' : '');
            var l = document.querySelector(sel);
            if (!l) {
              l = document.createElement('link');
              l.setAttribute('rel', rel);
              if (type) l.setAttribute('type', type);
              if (sizes) l.setAttribute('sizes', sizes);
              document.head.appendChild(l);
            }
            l.setAttribute('href', href);
          }
          setLink('manifest', '/manifest-aretia.json');
          setLink('apple-touch-icon', '/aretia-apple-touch-icon.png');
          setLink('icon', '/aretia-favicon-32.png', 'image/png', '32x32');
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', '#1E3A5F');
          var at = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (at) at.setAttribute('content', 'Aretia');
          document.title = 'Aretia';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Necesitas JavaScript para usar esta app.</noscript>
    <div id="root"></div>
  </body>
</html>
